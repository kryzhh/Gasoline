[package]
name = "gasoline_clatter_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
default = []
test-support = []

[dependencies]
clatter = { version = "=2.3.0", default-features = false, features = ["std", "use-25519", "use-chacha20poly1305", "use-blake2"] }

[profile.release]
codegen-units = 1
lto = true

